name: release

# Build on a version tag and publish to PyPI with Trusted Publishing (OIDC).
# No API token is stored anywhere. Setup steps: docs/RELEASING.md.
# Reference: https://docs.pypi.org/trusted-publishers/using-a-publisher/

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$ver" || { echo "tag $tag != pyproject $ver"; exit 1; }
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP" && /tmp/smoke/bin/whale --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
